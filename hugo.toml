baseURL = 'https://hangerlin.github.io/'
languageCode = 'zh-CN'
title = '欢迎来到 Hanger 的技术博客'
languageName = "简体中文"
hasCJKLanguage = true

theme = 'LoveIt'

# 启用 Gzip 压缩
enableGitInfo = true
enableEmoji = true
enableRobotsTXT = true
summaryLength = 100

[menu]
  [[menu.main]]
  name = "主页"
  weight = 10
  identifier = "home"
  url = "/"

  [[menu.main]]
  name = "高性能架构之道"
  url = "/high-performance-architecture/"
  weight = 2
  identifier = "high-performance-architecture"
  
  [[menu.main]]
  name = "JUC底层探秘"
  url = "/juc-exploration/"
  weight = 3
  identifier = "juc-exploration"
  
  [[menu.main]]
  name = "系统设计之美"
  url = "/system-design/"
  weight = 4
  identifier = "system-design"
  
  [[menu.main]]
  name = "线上问题迷云"
  url = "/online-issues/"
  weight = 5
  identifier = "online-issues"

[author]
  name = "HangerLin 林廷翰"
  email = "hangerlin@163.com"

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "HangerLin 的技术分享"
  description = "深入探讨 Java, JVM, JUC, 和各种高性能架构的设计与实现。"
  images = ["/logo.png"]
  # 网站 SEO 相关配置
  keywords = ["Java", "JVM", "并发编程", "高性能架构", "系统设计", "技术博客"]
  
  # CDN 配置
  [params.cdn]
    # 是否使用 CDN 加速
    enable = false
    # CDN 数据文件
    data = ""
    
  # 是否使用 KaTeX 支持数学公式
  [params.math]
    enable = true
    # 默认行内分隔符
    inlineLeftDelimiter = "$"
    inlineRightDelimiter = "$"
    # 默认块级分隔符
    blockLeftDelimiter = "$$"
    blockRightDelimiter = "$$"
    # KaTeX 扩展复制
    copyTex = true
    # KaTeX 扩展 mhchem
    mhchem = true

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = "https://cdn.jsdelivr.net/gh/HangerLIN/imageBeds2@main//images20240428191402.png"
      name = "HangerLIN"

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2024
    # icp = "沪ICP备12345678号"
    # license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    title = "HangerLIN's Tech Blog"
    themeColor = "#334455"
    iconColor = "#5bbad5"
    tileColor = "#0099cc"

  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 50
    highlightTag = "em"

  [params.home.profile]
    enable = true
    avatarURL = "https://cdn.jsdelivr.net/gh/HangerLIN/imageBeds2@main//images20240428191402.png"
    title = "欢迎你来到 Hanger 的技术博客！"
    subtitle = "专注于高性能后端架构经验实现经验分享~"
    typeit = true
    social = true

  [params.social]
    GitHub = "https://github.com/HangerLIN"
    Email = "mailto:hangerlin@163.com"
    
  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = true
    ruby = true
    fraction = true
    fontawesome = true
    linkToMarkdown = true
    rssFullText = true
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.math]
      enable = true
      blockLeftDelimiter = "$$"
      blockRightDelimiter = "$$"
      inlineLeftDelimiter = "$"
      inlineRightDelimiter = "$"
    [params.page.share]
      enable = true
      Twitter = true
      Weibo = true
    [params.page.comment]
      enable = true
      [params.page.comment.giscus]
        enable = true
        repo = "HangerLIN/HangerLIN.github.io"
        repoId = "R_kgDOLQIClw"
        category = "Announcements"
        categoryId = "DIC_kwDOLQICl84Cd7l2"
        mapping = "pathname"
        term = ""
        strict = "0"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "bottom"
        theme = "preferred_color_scheme"
        lang = "zh-CN"

# 压缩 HTML
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
